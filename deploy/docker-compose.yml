# TaskView: despliegue local aislado para uso diario.
# Documentación: deploy/README.md
#
# Aislamiento:
#   - Proyecto Compose propio ("taskview"): contenedores, redes y volúmenes con prefijo taskview_.
#   - Postgres vive en una red interna sin salida a Internet ni puertos publicados.
#   - Los puertos publicados escuchan solo en 127.0.0.1 (no se ven desde la red local).
#
# Persistencia:
#   - Los datos viven en el volumen con nombre fijo "taskview_pgdata". Sobrevive a
#     `docker compose down`, a reinicios y a actualizaciones de imagen.
#     Solo se borra con `docker compose down -v` o `docker volume rm taskview_pgdata`.

name: taskview

networks:
  db:
    name: taskview_db
    internal: true
  app:
    name: taskview_app

volumes:
  pgdata:
    name: taskview_pgdata
  api-logs:
    name: taskview_api_logs

x-api-db-env: &api-db-env
  DB_HOST: db
  DB_PORT: 5432
  DB_USER: ${POSTGRES_USER}
  DB_PASSWORD: ${POSTGRES_PASSWORD}
  DB_NAME: ${POSTGRES_DB}

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [db]

  migration:
    image: gimanhead/taskview-ce-db-migration:${TASKVIEW_VERSION}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    env_file: [./.env.taskview]
    environment: *api-db-env
    networks: [db]

  taskview-api-server:
    image: gimanhead/taskview-ce-api-server:${TASKVIEW_VERSION}
    restart: unless-stopped
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    ports:
      - "127.0.0.1:${API_PORT}:1401"
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    env_file: [./.env.taskview]
    environment: *api-db-env
    volumes:
      - api-logs:/usr/src/app/logs
    networks: [db, app]

  taskview-webapp:
    image: gimanhead/taskview-ce-webapp:${TASKVIEW_VERSION}
    restart: unless-stopped
    environment:
      # URL de la API tal como la ve el navegador.
      TASKVIEW_API_URL: "http://localhost:${API_PORT}"
    ports:
      - "127.0.0.1:${WEB_PORT}:80"
    depends_on: [taskview-api-server]
    networks: [app]

  # Servidor MCP por HTTP para Claude Code y otros asistentes (endpoint /mcp).
  # Cada petición se autentica con el token tvk_ de quien llama.
  taskview-mcp:
    image: gimanhead/taskview-ce-mcp:${TASKVIEW_VERSION}
    restart: unless-stopped
    environment:
      TASKVIEW_URL: "http://taskview-api-server:1401"
    ports:
      - "127.0.0.1:${MCP_PORT}:3100"
    depends_on: [taskview-api-server]
    networks: [app]
